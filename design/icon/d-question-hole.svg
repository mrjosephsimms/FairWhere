<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f8f4"/><stop offset="1" stop-color="#e9ece5"/></linearGradient>
    <linearGradient id="fw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34b46a"/><stop offset="1" stop-color="#1c7e45"/></linearGradient>
    <radialGradient id="gr" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#5fd18d"/><stop offset="1" stop-color="#2fae64"/></radialGradient>
    <pattern id="stripes" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="22" height="44" fill="#ffffff" opacity=".07"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b2a17" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- the hole: a question mark, from the tee (bottom of the stem) round the hook -->
  <g filter="url(#sh)">
    <!-- rough edge -->
    <path d="M512 640 C 512 560, 560 530, 600 500 C 670 450, 712 405, 712 330 C 712 225, 625 150, 512 150 C 400 150, 312 225, 312 330"
      fill="none" stroke="#16683a" stroke-width="150" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- fairway -->
    <path d="M512 640 C 512 560, 560 530, 600 500 C 670 450, 712 405, 712 330 C 712 225, 625 150, 512 150 C 400 150, 312 225, 312 330"
      fill="none" stroke="url(#fw)" stroke-width="124" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M512 640 C 512 560, 560 530, 600 500 C 670 450, 712 405, 712 330 C 712 225, 625 150, 512 150 C 400 150, 312 225, 312 330"
      fill="none" stroke="url(#stripes)" stroke-width="124" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- tee box at the start of the hole: the tip of the hook -->
    <rect x="276" y="318" width="72" height="34" rx="11" fill="#d9f2e2" opacity=".92"/>
    <!-- the dot: the green -->
    <circle cx="512" cy="820" r="94" fill="#16683a"/>
    <circle cx="512" cy="820" r="84" fill="url(#gr)"/>
  </g>
  <!-- cup + flag on the green -->
  <ellipse cx="502" cy="842" rx="18" ry="9" fill="#0d3b20"/>
  <rect x="496" y="742" width="12" height="102" rx="6" fill="#111813"/>
  <path d="M508 744 L596 774 L508 804 Z" fill="#d04146"/>
  <!-- ball on the tee -->
  <circle cx="312" cy="335" r="15" fill="#ffffff" stroke="#0d3b20" stroke-opacity=".25" stroke-width="3"/>
</svg>
