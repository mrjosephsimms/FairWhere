<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a single phone column, scorecard-strip motif — each round reads like a row on a scorecard */
:root{
  --bg:#eef1ea; --surface:#fbfcf8; --ink:#17251c; --muted:#5d6b60; --line:#d3dacd;
  --fairway:#1f5b3a; --fairway-soft:#dbe8dd; --flag:#c8452c; --sand:#e6d9b8;
  --good:#1f7a45; --warn:#b5701a; --bad:#b23a2a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1712; --surface:#17221b; --ink:#e4ebe2; --muted:#94a396; --line:#2a3a2f;
  --fairway:#5fbf86; --fairway-soft:#1d3426; --flag:#ef6a4e; --sand:#4a4330;
  --good:#5fc489; --warn:#e3a14a; --bad:#f07563; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --surface:#17221b; --ink:#e4ebe2; --muted:#94a396; --line:#2a3a2f;
  --fairway:#5fbf86; --fairway-soft:#1d3426; --flag:#ef6a4e; --sand:#4a4330;
  --good:#5fc489; --warn:#e3a14a; --bad:#f07563; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;text-transform:uppercase}
h1 span{color:var(--flag)}
.sub{color:var(--muted);font-size:13px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.tabs button{font:600 15px var(--body);padding:10px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fairway);color:var(--surface)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.tap{cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.who{font-weight:600;font-size:16px}
.course{color:var(--muted);font-size:13px}
.hole{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;letter-spacing:.01em}
.hole small{font-size:18px;color:var(--muted);font-weight:600;margin-left:4px}
.eta{text-align:right}
.eta b{font-family:var(--display);font-size:28px;font-weight:700;display:block;line-height:1}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.idle{color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(18,1fr);gap:2px}
.strip i{height:22px;border-radius:3px;background:var(--fairway-soft);font:500 10px var(--mono);font-style:normal;display:grid;place-items:center;color:var(--muted)}
.strip i.done{background:var(--fairway);color:var(--surface)}
.strip i.now{background:var(--flag);color:#fff}
.strip i.turn{margin-left:4px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
.map{width:100%;max-width:100%;aspect-ratio:1/1;background:var(--fairway-soft);border-radius:10px;display:block}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
form{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
select,input{font:16px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:600 16px var(--body);padding:13px 16px;border-radius:10px;border:0;background:var(--fairway);color:var(--surface);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.flag{background:var(--flag);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:10px}
.stepper .btn{font-size:26px;padding:10px 0}
.big{text-align:center}
.big .hole{font-size:84px}
.note{font-size:13px;color:var(--muted)}
.note.err{color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.confirm{background:var(--sand);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:no-preference){.strip i.now{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.65}}}
</style>

const COURSES = {"rh":{"name":"Redhawk Golf Club","holes":{"1":{"p":5,"y":529,"l":[[33.468083,-117.09208],[33.468001,-117.09176],[33.467884,-117.091399],[33.46779,-117.091102],[33.467583,-117.090052],[33.466084,-117.088232],[33.46596,-117.087714]]},"2":{"p":4,"y":398,"l":[[33.465282,-117.086791],[33.463917,-117.085198],[33.462928,-117.08406]]},"3":{"p":4,"y":366,"l":[[33.463426,-117.083686],[33.464805,-117.085408],[33.465391,-117.085795],[33.465472,-117.086207]]},"4":{"p":3,"y":155,"l":[[33.465875,-117.08721],[33.466766,-117.086124]]},"5":{"p":4,"y":471,"l":[[33.46755,-117.084844],[33.467644,-117.081727],[33.468038,-117.080278]]},"6":{"p":4,"y":389,"l":[[33.469365,-117.080313],[33.468863,-117.0841]]},"7":{"p":5,"y":561,"l":[[33.468043,-117.085261],[33.470677,-117.086975],[33.471237,-117.088791]]},"8":{"p":3,"y":161,"l":[[33.471334,-117.089612],[33.471817,-117.091092]]},"9":{"p":4,"y":402,"l":[[33.472372,-117.091554],[33.470303,-117.091557],[33.469333,-117.092471]]},"10":{"p":4,"y":429,"l":[[33.467525,-117.092998],[33.464205,-117.091578]]},"11":{"p":5,"y":552,"l":[[33.463344,-117.091439],[33.461383,-117.09031],[33.459845,-117.088159]]},"12":{"p":3,"y":151,"l":[[33.458811,-117.087592],[33.457961,-117.088671]]},"13":{"p":4,"y":468,"l":[[33.45711,-117.088146],[33.454599,-117.088006],[33.453618,-117.089085]]},"14":{"p":4,"y":342,"l":[[33.452405,-117.088235],[33.454283,-117.085722]]},"15":{"p":4,"y":356,"l":[[33.454826,-117.085437],[33.456166,-117.085876],[33.457703,-117.085831]]},"16":{"p":4,"y":453,"l":[[33.458815,-117.085275],[33.460711,-117.086303],[33.462125,-117.087307]]},"17":{"p":3,"y":206,"l":[[33.463348,-117.086312],[33.464795,-117.087377]]},"18":{"p":4,"y":475,"l":[[33.466234,-117.087458],[33.468038,-117.089987],[33.468269,-117.091312]]}}},"tci":{"name":"Temecula Creek Inn","holes":{"Stone House 1":{"p":5,"y":490,"l":[[33.468547,-117.134118],[33.467035,-117.133876],[33.466232,-117.132514],[33.465778,-117.131299]]},"Stone House 2":{"p":4,"y":344,"l":[[33.465361,-117.131275],[33.465683,-117.133489],[33.466422,-117.134219]]},"Stone House 3":{"p":4,"y":395,"l":[[33.465853,-117.134352],[33.46415,-117.133706],[33.462686,-117.133652]]},"Stone House 4":{"p":4,"y":317,"l":[[33.462412,-117.13319],[33.463909,-117.132383],[33.464846,-117.132654]]},"Stone House 5":{"p":3,"y":181,"l":[[33.465041,-117.131911],[33.46364,-117.131322]]},"Stone House 6":{"p":4,"y":411,"l":[[33.463173,-117.131268],[33.461753,-117.133041],[33.460748,-117.134082]]},"Stone House 7":{"p":4,"y":353,"l":[[33.460228,-117.134635],[33.462316,-117.134222],[33.463101,-117.134315]]},"Stone House 8":{"p":3,"y":167,"l":[[33.463585,-117.134961],[33.464955,-117.134885]]},"Stone House 9":{"p":5,"y":522,"l":[[33.464804,-117.135296],[33.467383,-117.134841],[33.468981,-117.134211]]},"Oaks 1":{"p":4,"y":338,"l":[[33.468673,-117.132655],[33.468012,-117.130818],[33.467054,-117.130155]]},"Oaks 2":{"p":5,"y":498,"l":[[33.466948,-117.129502],[33.465178,-117.128537],[33.463101,-117.127871]]},"Oaks 3":{"p":3,"y":178,"l":[[33.463314,-117.127454],[33.463328,-117.125698]]},"Oaks 4":{"p":4,"y":411,"l":[[33.462854,-117.126115],[33.460749,-117.125819],[33.459543,-117.125392]]},"Oaks 5":{"p":4,"y":444,"l":[[33.459375,-117.125038],[33.46184,-117.1247],[33.462973,-117.125051]]},"Oaks 6":{"p":3,"y":213,"l":[[33.463016,-117.124634],[33.461968,-117.122953]]},"Oaks 7":{"p":5,"y":520,"l":[[33.462211,-117.122431],[33.463616,-117.124984],[33.464797,-117.126493]]},"Oaks 8":{"p":4,"y":416,"l":[[33.465072,-117.126241],[33.466468,-117.128043],[33.467713,-117.128738]]},"Oaks 9":{"p":4,"y":396,"l":[[33.467639,-117.129602],[33.468936,-117.131361],[33.469306,-117.132857]]},"Creek 1":{"p":4,"y":378,"l":[[33.469972,-117.133536],[33.470629,-117.135347],[33.471627,-117.136624]]},"Creek 2":{"p":3,"y":142,"l":[[33.471863,-117.136966],[33.473017,-117.137195]]},"Creek 3":{"p":4,"y":354,"l":[[33.473767,-117.137558],[33.472973,-117.135738],[33.472719,-117.134338]]},"Creek 4":{"p":5,"y":535,"l":[[33.472332,-117.13468],[33.471852,-117.132563],[33.471899,-117.13071],[33.472088,-117.129504]]},"Creek 5":{"p":4,"y":407,"l":[[33.471542,-117.129308],[33.47118,-117.131486],[33.4714,-117.133256]]},"Creek 6":{"p":4,"y":367,"l":[[33.471063,-117.133494],[33.471865,-117.135135],[33.472724,-117.136509]]},"Creek 7":{"p":3,"y":173,"l":[[33.472213,-117.136598],[33.471331,-117.135262]]},"Creek 8":{"p":5,"y":537,"l":[[33.47101,-117.134736],[33.470453,-117.132715],[33.470557,-117.131086],[33.470906,-117.129617]]},"Creek 9":{"p":4,"y":362,"l":[[33.470335,-117.129554],[33.469799,-117.131265],[33.469752,-117.133008]]}}}};
const NINES = ["Creek","Oaks","Stone House"];
const W = {3:0.78,4:1,5:1.22};

function buildSeq(spec){
  // spec: "rh" | "tci:Creek|Oaks" | "other"
  if(spec==="rh") return Array.from({length:18},(_,i)=>({n:i+1,...COURSES.rh.holes[String(i+1)]}));
  if(spec&&spec.startsWith("tci:")){
    const [a,b]=spec.slice(4).split("|");
    return [a,b].flatMap(nine=>Array.from({length:9},(_,i)=>({...COURSES.tci.holes[nine+" "+(i+1)],n:0}))).map((h,i)=>({...h,n:i+1}));
  }
  const pars=[4,4,3,5,4,4,3,4,5,4,4,3,5,4,4,3,4,5];
  return pars.map((p,i)=>({n:i+1,p,y:null,l:null}));
}
function courseLabel(spec){
  if(spec==="rh") return "Redhawk Golf Club";
  if(spec&&spec.startsWith("tci:")){const [a,b]=spec.slice(4).split("|");return `Temecula Creek Inn · ${a} / ${b}`}
  return "Other course";
}
function alloc(seq,target){const s=seq.reduce((t,h)=>t+W[h.p],0);return seq.map(h=>target*W[h.p]/s)}

// Pace math: minutes. Returns {phase, eta(ms), delta(min, + = behind), pct}
function pace(r,now){
  const seq=buildSeq(r.course), a=alloc(seq,r.target||255), total=a.reduce((x,y)=>x+y,0);
  const tee=r.teeTime;
  if(r.status==="done") return {phase:"done",eta:r.finishedAt,delta:((r.finishedAt-tee)/60000)-total};
  if(now<tee) return {phase:"pre",eta:tee+total*60000,delta:0};
  const h=Math.min(Math.max(r.hole||1,1),18);
  const before=a.slice(0,h-1).reduce((x,y)=>x+y,0);
  const onHole=Math.max(0,(now-(r.holeStartedAt||tee))/60000);
  const frac=Math.min(onHole/a[h-1],0.9);
  const expected=before+frac*a[h-1];
  const elapsed=(now-tee)/60000;
  let p=expected>20?elapsed/expected:1; p=Math.min(Math.max(p,0.8),1.5);
  const remain=(total-expected)*p;
  return {phase:"live",eta:now+remain*60000,delta:elapsed-expected,frac};
}
const fmtT=ms=>new Date(ms).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
function ago(ms){const m=Math.round((Date.now()-ms)/60000);return m<1?"just now":m<60?`${m} min ago`:`${Math.floor(m/60)}h ${m%60}m ago`}
function paceChip(pc){
  if(pc.phase==="pre") return `<span class="pill idle">Not started</span>`;
  if(pc.phase==="done") return `<span class="pill idle">Finished</span>`;
  const d=Math.round(pc.delta);
  if(Math.abs(d)<=5) return `<span class="pill good">On pace</span>`;
  if(d<0) return `<span class="pill good">${-d} min ahead</span>`;
  return `<span class="pill ${d>15?"bad":"warn"}">${d} min behind</span>`;
}
function strip(r){
  return `<div class="strip" aria-label="Hole ${r.hole} of 18">${Array.from({length:18},(_,i)=>{
    const n=i+1, cls=r.status==="done"||n<r.hole?"done":(n===r.hole&&Date.now()>=r.teeTime?"now":"");
    return `<i class="${cls}${n===10?" turn":""}">${n}</i>`}).join("")}</div>`;
}
function mapSVG(r,pc){
  const seq=buildSeq(r.course); if(!seq[0].l) return "";
  const pts=seq.flatMap(h=>h.l), lat0=pts.reduce((s,p)=>s+p[0],0)/pts.length, k=Math.cos(lat0*Math.PI/180);
  const xs=pts.map(p=>p[1]*k), ys=pts.map(p=>-p[0]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const span=Math.max(maxX-minX,maxY-minY), pad=span*0.08, S=1000/(span+2*pad);
  const ox=(minX+maxX)/2, oy=(minY+maxY)/2;
  const P=p=>[(p[1]*k-ox)*S+500,(-p[0]-oy)*S+500];
  const cur=r.status==="done"?0:r.hole;
  let out=`<svg class="map" viewBox="0 0 1000 1000" role="img" aria-label="Course map with hole ${cur}">`;
  seq.forEach(h=>{
    const d=h.l.map((p,i)=>(i?"L":"M")+P(p).map(v=>v.toFixed(1)).join(" ")).join("");
    const on=h.n===cur, past=r.status==="done"||h.n<cur;
    const g=P(h.l[h.l.length-1]), t=P(h.l[0]);
    out+=`<path d="${d}" fill="none" stroke="${on?"var(--flag)":past?"var(--fairway)":"var(--muted)"}" stroke-width="${on?14:7}" stroke-linecap="round" stroke-linejoin="round" opacity="${on?1:past?.75:.45}"/>`;
    out+=`<circle cx="${g[0]}" cy="${g[1]}" r="${on?16:10}" fill="${on?"var(--flag)":"var(--fairway)"}"/>`;
    out+=`<text x="${t[0]}" y="${t[1]-14}" font-family="IBM Plex Mono,monospace" font-size="${on?34:24}" font-weight="600" text-anchor="middle" fill="var(--ink)">${h.n}</text>`;
  });
  if(pc.phase==="live"){
    let pos;
    if(r.lat&&r.lng&&Date.now()-(r.locAt||0)<15*60000) pos=P([r.lat,r.lng]);
    else{const h=seq[cur-1],L=h.l,f=pc.frac||0;
      const seg=[];let tot=0;for(let i=1;i<L.length;i++){const a=P(L[i-1]),b=P(L[i]),d=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push([a,b,d]);tot+=d}
      let want=f*tot;pos=P(L[0]);for(const [a,b,d] of seg){if(want<=d){pos=[a[0]+(b[0]-a[0])*want/d,a[1]+(b[1]-a[1])*want/d];break}want-=d;pos=b}}
    out+=`<circle cx="${pos[0]}" cy="${pos[1]}" r="22" fill="var(--surface)" stroke="var(--flag)" stroke-width="8"/>`;
  }
  return out+"</svg>";
}

// ---------- state ----------
let db=null,user=null,me=null,rounds=[],names={},canWrite=null,openId=null,tab="follow",confirmEnd=false,gpsWatch=null,gpsMsg="";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function setStatus(t,err){$("status").textContent=t||"";$("status").className="note"+(err?" err":"")}

function visible(r){
  const now=Date.now();
  if(r.status==="done") return now-(r.finishedAt||0)<4*3600e3;
  return now-(r.updatedAt||0)<12*3600e3;
}
async function resolveNames(){
  if(!user) return;
  try{const ids=rounds.map(r=>r.uid).filter(Boolean);if(!ids.length)return;
    const ps=await user.profiles(ids);ids.forEach(id=>{names[id]=(ps[id]&&ps[id].name)||""});render()}catch(e){}
}

function renderFollow(){
  const el=$("view-follow"), list=rounds.filter(visible).sort((a,b)=>(a.status==="done")-(b.status==="done")||a.teeTime-b.teeTime);
  if(!db){el.innerHTML=`<div class="card empty"><strong>Sign in to see who's out</strong>Live rounds load once you're signed in to Claude and this page is shared with you.</div>`;return}
  if(!list.length){el.innerHTML=`<div class="card empty"><strong>Nobody's on the course right now</strong>When a friend starts a round under <em>My round</em>, their hole and finish time show up here.</div>`;return}
  const now=Date.now();
  el.innerHTML=list.map(r=>{
    const pc=pace(r,now), nm=esc(names[r.uid]||(r.uid===me?"You":"Golfer")), seq=buildSeq(r.course), h=seq[(r.hole||1)-1];
    const holeTxt=pc.phase==="pre"?`<div class="hole">${fmtT(r.teeTime)}<small>tee time</small></div>`:pc.phase==="done"?`<div class="hole">18<small>done</small></div>`:`<div class="hole">${r.hole}<small>par ${h.p}${h.y?` · ${h.y} yds`:""}</small></div>`;
    const etaLbl=pc.phase==="done"?"Finished":"Est. finish";
    return `<article class="card tap" data-id="${esc(r.id)}" tabindex="0">
      <div class="row"><div><div class="who">${nm}</div><div class="course">${esc(courseLabel(r.course))}</div></div>${paceChip(pc)}</div>
      <div class="row">${holeTxt}<div class="eta"><span class="label">${etaLbl}</span><b>${fmtT(pc.eta)}</b></div></div>
      ${strip(r)}
      <div class="meta"><span>Teed off <b>${fmtT(r.teeTime)}</b></span>${pc.phase==="live"?`<span>About <b>${fmtDur(pc.eta-now)}</b> left</span>`:""}<span>Updated ${ago(r.updatedAt)}</span></div>
      ${openId===r.id?mapSVG(r,pc):""}
    </article>`}).join("");
}
const fmtDur=ms=>{const m=Math.max(0,Math.round(ms/60000));return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m} min`};

function teeDefault(){const d=new Date(Date.now()+5*60000);d.setMinutes(Math.ceil(d.getMinutes()/8)*8,0,0);return d.toTimeString().slice(0,5)}

function renderMine(){
  const el=$("view-mine"), r=rounds.find(x=>x.uid===me&&x.status!=="done");
  if(!db||!me){el.innerHTML=`<div class="card empty"><strong>Sign in to share a round</strong>Open this page signed in to Claude to post your progress.</div>`;return}
  if(canWrite===false){el.innerHTML=`<div class="card empty"><strong>You can follow, not post</strong>Ask whoever shared this page to make you a Contributor so you can share your own rounds.</div>`;return}
  if(!r){
    el.innerHTML=`<form class="card" id="start-form">
      <label class="f" for="f-course">Course<select id="f-course">
        <option value="rh">Redhawk Golf Club</option>
        <option value="tci">Temecula Creek Inn (27 holes)</option>
        <option value="other">Other course (no map)</option></select></label>
      <div class="two" id="nine-row" hidden>
        <label class="f" for="f-front">Front nine<select id="f-front">${NINES.map(n=>`<option>${n}</option>`).join("")}</select></label>
        <label class="f" for="f-back">Back nine<select id="f-back">${NINES.map((n,i)=>`<option${i===1?" selected":""}>${n}</option>`).join("")}</select></label>
      </div>
      <div class="two">
        <label class="f" for="f-tee">Tee time<input id="f-tee" type="time" value="${teeDefault()}"></label>
        <label class="f" for="f-target">Usual pace<select id="f-target">
          <option value="225">3h 45m</option><option value="240">4h 00m</option><option value="255" selected>4h 15m</option><option value="270">4h 30m</option><option value="285">4h 45m</option></select></label>
      </div>
      <button class="btn" type="submit">Start sharing my round</button>
      <p class="note">Friends see your hole, tee time and estimated finish. Stop sharing anytime.</p>
    </form>`;
    const sync=()=>{$("nine-row").hidden=$("f-course").value!=="tci"};
    $("f-course").onchange=sync;sync();
    $("start-form").onsubmit=startRound;
    return;
  }
  const pc=pace(r,Date.now()), seq=buildSeq(r.course), h=seq[r.hole-1];
  el.innerHTML=`<div class="card">
    <div class="row"><div class="course">${esc(courseLabel(r.course))}</div>${paceChip(pc)}</div>
    <div class="big"><span class="label">${pc.phase==="pre"?"Tees off "+fmtT(r.teeTime):"On hole"}</span><div class="hole">${r.hole}</div>
      <div class="note">Par ${h.p}${h.y?` · ${h.y} yds`:""} · finish around <b>${fmtT(pc.eta)}</b></div></div>
    <div class="stepper">
      <button class="btn ghost" id="b-prev" aria-label="Back one hole" ${r.hole<=1?"disabled":""}>−</button>
      ${r.hole<18?`<button class="btn" id="b-next">Walking to ${r.hole+1}</button>`:`<button class="btn flag" id="b-done">Finish round</button>`}
      <button class="btn ghost" id="b-next2" aria-label="Forward one hole" ${r.hole>=18?"disabled":""}>+</button>
    </div>
    ${strip(r)}
    ${mapSVG(r,pc)}
    <div class="actions">
      <button class="btn ghost" id="b-gps">${gpsWatch!==null?"Stop auto-detect":"Auto-detect hole (GPS)"}</button>
      <button class="btn ghost" id="b-end">Stop sharing</button>
    </div>
    ${gpsMsg?`<p class="note">${esc(gpsMsg)}</p>`:""}
    ${confirmEnd?`<div class="confirm"><b>Stop sharing this round?</b><span class="note">It disappears from your friends' list.</span><div class="actions"><button class="btn flag" id="b-end-yes">Stop sharing</button><button class="btn ghost" id="b-end-no">Keep going</button></div></div>`:""}
  </div>`;
  const go=n=>setHole(r,n);
  $("b-prev").onclick=()=>go(r.hole-1);
  if($("b-next")) $("b-next").onclick=()=>go(r.hole+1);
  $("b-next2").onclick=()=>go(r.hole+1);
  if($("b-done")) $("b-done").onclick=()=>finish(r);
  $("b-end").onclick=()=>{confirmEnd=true;render()};
  if($("b-end-yes")) $("b-end-yes").onclick=async()=>{confirmEnd=false;await write(()=>db.doc("rounds/"+me).delete());stopGps()};
  if($("b-end-no")) $("b-end-no").onclick=()=>{confirmEnd=false;render()};
  $("b-gps").onclick=()=>gpsWatch!==null?stopGps():startGps(r);
}

async function write(fn){
  try{await fn();setStatus("")}catch(e){
    if(e&&e.code==="invalid_argument"){canWrite=false;render()}
    setStatus("Couldn't save that. Check your connection and try again.",true)}
}
async function startRound(ev){
  ev.preventDefault();
  let course=$("f-course").value;
  if(course==="tci"){const a=$("f-front").value,b=$("f-back").value;if(a===b){setStatus("Pick two different nines.",true);return}course=`tci:${a}|${b}`}
  const [hh,mm]=$("f-tee").value.split(":").map(Number); const t=new Date();t.setHours(hh,mm,0,0);
  if(t.getTime()-Date.now()>14*3600e3) t.setDate(t.getDate()-1);
  const now=Date.now(), tee=t.getTime();
  await write(()=>db.doc("rounds/"+me).set({uid:me,course,teeTime:tee,target:Number($("f-target").value),hole:1,holeStartedAt:Math.max(tee,now),status:"live",updatedAt:now}));
}
async function setHole(r,n){
  if(n<1||n>18||n===r.hole) return;
  const now=Date.now();
  await write(()=>db.doc("rounds/"+me).update({hole:n,holeStartedAt:now,updatedAt:now}));
}
async function finish(r){
  const now=Date.now(); stopGps();
  await write(()=>db.doc("rounds/"+me).update({status:"done",finishedAt:now,updatedAt:now}));
}

// GPS: nearest hole centerline among holes at or just past the current one
function distM(a,b){const R=6371000,la=(a[0]+b[0])/2*Math.PI/180;return Math.hypot((b[1]-a[1])*Math.PI/180*Math.cos(la)*R,(b[0]-a[0])*Math.PI/180*R)}
function nearHole(seq,pt,cur){
  let best=null;
  for(let i=Math.max(0,cur-2);i<Math.min(18,cur+3);i++){
    const L=seq[i].l;
    for(let j=1;j<L.length;j++){
      const a=L[j-1],b=L[j],k=Math.cos(a[0]*Math.PI/180);
      const ax=a[1]*k,ay=a[0],bx=b[1]*k,by=b[0],px=pt[1]*k,py=pt[0];
      const t=Math.max(0,Math.min(1,((px-ax)*(bx-ax)+(py-ay)*(by-ay))/((bx-ax)**2+(by-ay)**2||1)));
      const d=distM(pt,[ay+(by-ay)*t,(ax+(bx-ax)*t)/k]);
      if(!best||d<best.d) best={n:i+1,d};
    }
  }
  return best;
}
let lastFix={n:0,count:0},lastWrite=0;
function startGps(r){
  if(!buildSeq(r.course)[0].l){gpsMsg="Auto-detect needs a mapped course. Use the buttons for this one.";render();return}
  if(!navigator.geolocation){gpsMsg="This view can't read your location. Use the buttons to move holes.";render();return}
  gpsMsg="Looking for your location…";
  try{
    gpsWatch=navigator.geolocation.watchPosition(async pos=>{
      const cur=rounds.find(x=>x.uid===me&&x.status!=="done"); if(!cur) return;
      const pt=[pos.coords.latitude,pos.coords.longitude], hit=nearHole(buildSeq(cur.course),pt,cur.hole);
      if(!hit||hit.d>120){gpsMsg="GPS is on. You look off the course, so the hole stays put.";render();return}
      gpsMsg=`GPS is on. Nearest hole: ${hit.n}.`;
      lastFix=hit.n===lastFix.n?{n:hit.n,count:lastFix.count+1}:{n:hit.n,count:1};
      const now=Date.now();
      if(lastFix.count>=2&&hit.n!==cur.hole&&hit.n>=cur.hole){await write(()=>db.doc("rounds/"+me).update({hole:hit.n,holeStartedAt:now,lat:pt[0],lng:pt[1],locAt:now,updatedAt:now}));lastWrite=now}
      else if(now-lastWrite>90000){await write(()=>db.doc("rounds/"+me).update({lat:pt[0],lng:pt[1],locAt:now,updatedAt:now}));lastWrite=now}
      else render();
    },()=>{stopGps();gpsMsg="Location is blocked in this view. Use the buttons to move holes; it takes one tap per hole.";render()},{enableHighAccuracy:true,maximumAge:15000,timeout:20000});
  }catch(e){gpsWatch=null;gpsMsg="Location is blocked in this view. Use the buttons to move holes.";}
  render();
}
function stopGps(){if(gpsWatch!==null){try{navigator.geolocation.clearWatch(gpsWatch)}catch(e){}}gpsWatch=null;render()}

function render(){
  $("clock").textContent=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  $("tab-follow").setAttribute("aria-selected",tab==="follow");$("tab-mine").setAttribute("aria-selected",tab==="mine");
  $("view-follow").hidden=tab!=="follow";$("view-mine").hidden=tab!=="mine";
  const focusedInForm=document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#start-form");
  if(tab==="follow") renderFollow(); else if(!focusedInForm) renderMine();
}
$("tab-follow").onclick=()=>{tab="follow";render()};
$("tab-mine").onclick=()=>{tab="mine";render()};
$("view-follow").addEventListener("click",e=>{const c=e.target.closest(".card.tap");if(!c)return;openId=openId===c.dataset.id?null:c.dataset.id;render()});
$("view-follow").addEventListener("keydown",e=>{if(e.key==="Enter"){const c=e.target.closest(".card.tap");if(c){openId=openId===c.dataset.id?null:c.dataset.id;render()}}});
setInterval(render,30000);
render();

(async()=>{
  try{
    [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(user){try{me=await user.id()}catch(e){} try{canWrite=await user.can("data.write")}catch(e){}}
    if(!db){render();return}
    db.collection("rounds").onSnapshot(snap=>{
      rounds=snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r&&r.teeTime);
      render();resolveNames();
    },()=>{setStatus("Live updates stopped. Reload the page to reconnect.",true)});
    render();
  }catch(e){render()}
})();
</script>
