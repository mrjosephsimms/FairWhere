# Supabase CLI config (local dev / `supabase link`). The hosted project's settings live in its dashboard.
project_id = "find-my-golfer"

[auth]
site_url = "http://localhost:5180"
additional_redirect_urls = ["findmygolfer://auth-callback", "http://localhost:5180", "http://localhost:5180/**", "http://100.111.147.89:5180/**"]

# Magic link email: the app accepts either the link or the 6-digit code (SignIn.tsx).
# NOT pushed yet: the free plan rejects template edits on Supabase's built-in mailer.
# Uncomment once custom SMTP is configured (Auth -> SMTP), then `supabase config push`.
# [auth.email.template.magic_link]
# subject = "Your Find My Golfer sign-in code"
# content_path = "./supabase/templates/magic_link.html"

# Pinned to the hosted project's values so `supabase config push` only changes what we mean to.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 6
