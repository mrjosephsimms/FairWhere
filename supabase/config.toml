# Supabase CLI config (local dev / `supabase link`). The hosted project's settings live in its dashboard.
project_id = "fairwhere"

[auth]
site_url = "http://localhost:5180"
additional_redirect_urls = ["fairwhere://auth-callback", "http://localhost:5180", "http://localhost:5180/**", "http://100.111.147.89:5180/**"]

# Magic link email: the app accepts either the link or the 6-digit code (SignIn.tsx).
# Needs custom SMTP (set in the dashboard: Auth -> Emails -> SMTP, Gmail app password).
[auth.email.template.magic_link]
subject = "Your FairWhere sign-in code"
content_path = "./supabase/templates/magic_link.html"

# First-time email sign-ups get this one instead; it needs the code too.
[auth.email.template.confirmation]
subject = "Your FairWhere sign-in code"
content_path = "./supabase/templates/confirmation.html"

# Pinned to the hosted project's values so `supabase config push` only changes what we mean to.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 6

# Emails per hour across the project (only adjustable with custom SMTP).
[auth.rate_limit]
email_sent = 30

# Native Sign in with Apple (app/ios/App/App/AppleSignInPlugin.swift): Supabase checks Apple's
# identity token against the app's bundle ID. No secret needed (that's only for the web flow).
[auth.external.apple]
enabled = true
client_id = "com.sunnysimms.fairwhere"
secret = ""

# Push sender (supabase/functions/push). Called by the database (pg_net), not by users, and
# harmless to call: it only delivers alerts that are already due, each at most once.
[functions.push]
verify_jwt = false
