# Supabase CLI config (local dev / `supabase link`). The hosted project's settings live in its dashboard.
project_id = "fairwhere"

[auth]
site_url = "http://localhost:5180"
additional_redirect_urls = ["fairwhere://auth-callback", "http://localhost:5180", "http://localhost:5180/**", "http://100.111.147.89:5180/**"]

# Magic link email: the app accepts either the link or the 6-digit code (SignIn.tsx).
# Needs custom SMTP (set in the dashboard: Auth -> Emails -> SMTP, Gmail app password).
[auth.email.template.magic_link]
subject = "Your FairWhere sign-in code"
content_path = "./supabase/templates/magic_link.html"

# First-time email sign-ups get this one instead; it needs the code too.
[auth.email.template.confirmation]
subject = "Your FairWhere sign-in code"
content_path = "./supabase/templates/confirmation.html"

# Pinned to the hosted project's values so `supabase config push` only changes what we mean to.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 6

# Emails per hour across the project (only adjustable with custom SMTP).
[auth.rate_limit]
# Project-wide sign-in emails per hour. Gmail SMTP allows ~500/day; move to Resend before this
# needs to go higher (each new user's first sign-in sends one).
email_sent = 30
# Per IP address, per 5 minutes: requesting codes / signing in, and checking codes (stops guessing).
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

# Native Sign in with Apple (app/ios/App/App/AppleSignInPlugin.swift): Supabase checks Apple's
# identity token against the app's bundle ID. No secret needed (that's only for the web flow).
[auth.external.apple]
enabled = true
client_id = "com.sunnysimms.fairwhere"
secret = ""

# Google sign-in (enabled in the dashboard 2026-10-08). The secret lives only in Supabase: export
# SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET before any `supabase config push`, or don't push auth config.
[auth.external.google]
enabled = true
client_id = "947945052207-aj3fo2tdc0jicc1m3ims4bbutkj8q23s.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Push sender (supabase/functions/push). Called by the database (pg_net), not by users, and
# harmless to call: it only delivers alerts that are already due, each at most once.
[functions.push]
verify_jwt = false
